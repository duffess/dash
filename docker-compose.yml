services:
  db:
    image: postgres:15-alpine
    container_name: dashflow_postgres
    restart: always
    environment:
      POSTGRES_USER: dashflow_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: dashflow
    ports:
      - '127.0.0.1:5432:5432'
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.secrets/postgres_password}
